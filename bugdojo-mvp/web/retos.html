<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BugDojo · Tus retos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav">
    <a class="logo dojo-c" href="index.html" style="text-decoration:none">🥋 BugDojo</a>
    <span class="tag">MVP</span>
  </header>

  <main class="wrap screen">
    <p class="avance" id="avance"></p>
    <h1>Tu camino al <span class="dojo-grad">cinturón negro</span></h1>
    <p class="lead">Ve en orden o elige el que quieras.</p>

    <div id="lista" class="cinturones"></div>

    <div id="pregunta" class="pregunta" hidden>
      <p>¿Volverías mañana por un reto nuevo?</p>
      <div class="fila">
        <button class="btn dojo-bg" data-v="si">Sí</button>
        <button class="btn ghost" data-v="no">No</button>
      </div>
    </div>
    <p id="gracias" class="hint" hidden>¡Gracias! Tu respuesta nos ayuda a decidir si BugDojo sigue.</p>
  </main>
  <footer class="firma"><span>@carli.code</span></footer>

  <script src="common.js"></script>
  <script src="retos.js"></script>
  <script>
    const hechos = resueltos();
    document.getElementById("avance").textContent = `${hechos.length} de ${RETOS.length} resueltos`;
    document.getElementById("lista").innerHTML = RETOS.map((r) => `
      <a class="cinturon" href="reto.html?id=${r.id}">
        <span class="cinta" style="background:${r.color}"></span>
        <span class="info"><small>Cinturón ${r.cinturon}</small><b>${r.titulo}</b></span>
        <span class="estado">${hechos.includes(r.id) ? "✅" : "→"}</span>
      </a>`).join("");

    // Pregunta de valor: solo después de resolver al menos un reto, una sola vez.
    const s = estado.leer();
    if (hechos.length > 0 && !s.feedback) {
      const caja = document.getElementById("pregunta");
      caja.hidden = false;
      caja.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
        evento("feedback", { valor: b.dataset.v });
        estado.guardar({ feedback: b.dataset.v });
        caja.hidden = true;
        document.getElementById("gracias").hidden = false;
      }));
    }
  </script>
</body>
</html>
