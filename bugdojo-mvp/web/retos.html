<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BugDojo · Tus retos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav">
    <a class="logo" href="index.html"><i data-icono="code-xml"></i>BugDojo</a>
    <span class="tag" id="avance"><i data-icono="trophy"></i></span>
  </header>

  <main class="wrap screen">
    <p class="eyebrow">Prueba gratuita · 5 retos</p>
    <h1>Tu camino al <span class="dojo-grad">cinturón negro</span></h1>
    <p class="lead">Cada reto tiene 3 fases: <b>Aprende</b>, <b>Arma</b> y <b>Escribe</b>. Ve en orden o elige el que quieras.</p>

    <div id="lista" class="lista"></div>

    <div id="pregunta" class="pregunta-valor" hidden>
      <p>¿Volverías mañana por un reto nuevo?</p>
      <div class="acciones">
        <button class="btn dojo" data-v="si"><i data-icono="thumbs-up"></i>Sí</button>
        <button class="btn ghost" data-v="no"><i data-icono="thumbs-down"></i>No</button>
      </div>
    </div>
    <p id="gracias" class="hint" hidden>¡Gracias! Tu respuesta nos ayuda a decidir si BugDojo sigue.</p>
  </main>
  <footer class="firma"><span>@carli.code</span></footer>

  <script src="ui.js"></script>
  <script src="common.js"></script>
  <script src="retos.js"></script>
  <script>
    const ICONOS_FASE = { aprendido: "book-open", armado: "puzzle", resuelto: "keyboard" };
    const armados = RETOS.filter((r) => progreso(r.id).armado).length;
    document.getElementById("avance").insertAdjacentHTML("beforeend", `${armados} de ${RETOS.length}`);

    document.getElementById("lista").innerHTML = RETOS.map((r) => {
      const p = progreso(r.id);
      const fases = FASES.map((f) => `<span class="${p[f] ? "hecha" : ""}" title="${f}">${icono(p[f] && f === "resuelto" ? "circle-check" : ICONOS_FASE[f])}</span>`).join("");
      return `
        <a class="card-reto" href="reto.html?id=${r.id}">
          <span class="cinta" style="background:${r.color}"></span>
          <span class="info"><small>Cinturón ${r.cinturon}</small><b>${r.titulo}</b></span>
          <span class="fases-mini" aria-label="Fases completadas">${fases}</span>
        </a>`;
    }).join("");

    // Pregunta de valor: solo después de armar al menos un programa, una sola vez.
    const s = estado.leer();
    if (armados > 0 && !s.feedback) {
      const caja = document.getElementById("pregunta");
      caja.hidden = false;
      caja.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
        evento("feedback", { valor: b.dataset.v });
        estado.guardar({ feedback: b.dataset.v });
        caja.hidden = true;
        document.getElementById("gracias").hidden = false;
      }));
    }
  </script>
</body>
</html>
