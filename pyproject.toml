[project]
name = "experimento-lean-aws"
version = "0.1.0"
description = "Experimento Lean en vivo en AWS: BugDojo vs Focusaurio + MVP de BugDojo"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
