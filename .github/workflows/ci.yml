name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint y tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"   # el mismo runtime que Lambda
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  infra:
    name: Templates (cfn-lint + sam validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # El mismo rango que requirements-dev.txt, para que ambos lados coincidan
      - run: pip install 'cfn-lint>=1,<2'
      - run: cfn-lint template.yaml bugdojo-mvp/template.yaml infra/*.yaml
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true
      # sam validate --lint no necesita credenciales de AWS
      - run: sam validate --lint --region us-east-1 --template template.yaml
      - run: sam validate --lint --region us-east-1 --template bugdojo-mvp/template.yaml
