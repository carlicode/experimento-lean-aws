name: Deploy

# Manual: Actions → Deploy → Run workflow → elegir el stack.
on:
  workflow_dispatch:
    inputs:
      stack:
        description: Stack a desplegar
        type: choice
        options: [experimento-lean, bugdojo-mvp]
        required: true

concurrency:
  group: deploy-${{ inputs.stack }}
  cancel-in-progress: false

jobs:
  # Los tests corren sin credenciales ni environment: una dependencia
  # comprometida de pip no debería poder pedir el token OIDC.
  test:
    name: Lint y tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"   # el mismo runtime que Lambda
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  deploy:
    name: Deploy ${{ inputs.stack }}
    runs-on: ubuntu-latest
    needs: test
    environment: produccion   # con aprobación manual (ver README)
    permissions:
      contents: read
      id-token: write   # para pedir el token OIDC a GitHub
    env:
      DIR: ${{ inputs.stack == 'bugdojo-mvp' && 'bugdojo-mvp' || '.' }}
      SAM_S3_BUCKET: ${{ vars.SAM_S3_BUCKET }}
      CFN_ROLE_ARN: ${{ vars.CFN_ROLE_ARN }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      CLAVE_REINICIO: ${{ inputs.stack == 'bugdojo-mvp' && secrets.CLAVE_REINICIO || '' }}   # botón "Reiniciar datos"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Credenciales temporales de AWS (OIDC, sin access keys)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true
      - name: Deploy
        working-directory: ${{ env.DIR }}
        run: ./scripts/deploy.sh
