AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Deploy desde GitHub Actions sin access keys. GitHub pide un token OIDC de corta
  duración, AWS lo valida y entrega credenciales temporales solo a este repo y
  solo a jobs que corren en el environment indicado. Se despliega una sola vez.

Parameters:
  PrefijoSub:
    Type: String
    Default: repo:carlicode@43819418/experimento-lean-aws@1427917805
    AllowedPattern: ^repo:[^:\s]+$
    Description: >
      Prefijo del claim sub de OIDC de este repo. Los repos creados desde el 15 de
      julio de 2026 usan el formato inmutable repo:OWNER@OWNER-ID/REPO@REPO-ID (con IDs
      numéricos); los más antiguos usan repo:OWNER/REPO. Pide el valor exacto a GitHub:
      gh api repos/OWNER/REPO/actions/oidc/customization/sub --jq .sub_claim_prefix
  Environment:
    Type: String
    Default: produccion
    Description: GitHub Environment (con aprobación) desde el que se puede desplegar
  ProveedorOidcArn:
    Type: String
    Default: ""
    Description: >
      ARN de un proveedor OIDC de GitHub que ya exista en la cuenta (solo puede
      haber uno por cuenta). Vacío = crearlo aquí.

Conditions:
  CrearProveedor: !Equals [!Ref ProveedorOidcArn, ""]

Resources:
  ProveedorGitHub:
    Type: AWS::IAM::OIDCProvider
    Condition: CrearProveedor
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # Bucket para los artefactos de SAM (el zip de cada Lambda). Se crea aquí para
  # que el rol de GitHub solo tenga acceso a este bucket y no a resolve_s3.
  Artefactos:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: borrar-artefactos-viejos
            Status: Enabled
            ExpirationInDays: 30

  # Rol que usa CloudFormation para crear los recursos de los stacks. GitHub no
  # tiene estos permisos: solo puede pedirle a CloudFormation que use este rol.
  RolCloudFormation:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: recursos-de-los-stacks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Solo los servicios que usan template.yaml y bugdojo-mvp/template.yaml.
              # Acotamos por nombre donde CloudFormation genera nombres predecibles
              # (<stack>-<Recurso>-<aleatorio>). CloudFront, API Gateway y Budgets no
              # tienen nombre propio, así que quedan en "*".
              - Sid: ServiciosSinNombre
                Effect: Allow
                Action:
                  - apigateway:*
                  - budgets:*
                  - cloudfront:*
                Resource: "*"
              - Sid: TablasDeLosStacks
                Effect: Allow
                Action: dynamodb:*
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/experimento-lean-*
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/bugdojo-mvp-*
              - Sid: LambdasDeLosStacks
                Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:experimento-lean-*
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:bugdojo-mvp-*
              - Sid: LogsDeLasLambdas
                Effect: Allow
                Action: logs:*
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/experimento-lean-*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/experimento-lean-*:*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/bugdojo-mvp-*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/bugdojo-mvp-*:*
              - Sid: BucketsDeLosSitios
                Effect: Allow
                Action: s3:*
                Resource:
                  - arn:aws:s3:::experimento-lean-*
                  - arn:aws:s3:::experimento-lean-*/*
                  - arn:aws:s3:::bugdojo-mvp-*
                  - arn:aws:s3:::bugdojo-mvp-*/*
              # Los roles de las Lambdas, y solo los de estos dos stacks.
              - Sid: RolesDeLasLambdas
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/experimento-lean-*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bugdojo-mvp-*
              # SAM solo les adjunta una política administrada (AWSLambdaBasicExecutionRole,
              # verificado traduciendo los templates con samtranslator); DynamoDBCrudPolicy
              # termina como política inline, no administrada.
              - Sid: AdjuntarSoloLaPoliticaBasicaDeLambda
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/experimento-lean-*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bugdojo-mvp-*
                Condition:
                  ArnEquals:
                    iam:PolicyARN: arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
              - Sid: PasarRolesSoloALambda
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/experimento-lean-*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bugdojo-mvp-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              # Este stack (el del OIDC) también crea roles: que CloudFormation no
              # pueda tocarlos aunque el stack se llame como los demás.
              - Sid: NoTocarLosRolesDeEsteStack
                Effect: Deny
                Action: iam:*
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-*

  RolGitHub:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CrearProveedor, !Ref ProveedorGitHub, !Ref ProveedorOidcArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # El sub de un environment no menciona la rama: que solo main pueda
                # desplegar depende del ajuste "Deployment branches = main" del
                # environment en GitHub (ver README). Un PR o un fork nunca corren
                # en este environment, así que tampoco pueden asumir el rol.
                token.actions.githubusercontent.com:sub: !Sub ${PrefijoSub}:environment:${Environment}
      Policies:
        - PolicyName: desplegar-stacks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudFormationSoloEstosStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/experimento-lean/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/bugdojo-mvp/*
              - Sid: TransformDeSam
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: UsarElRolDeCloudFormation
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt RolCloudFormation.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: SubirArtefactos
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${Artefactos.Arn}/*
              - Sid: ListarArtefactos
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt Artefactos.Arn
              # CloudFormation nombra los buckets <stack>-sitio-<aleatorio>
              - Sid: SincronizarSitios
                Effect: Allow
                Action: [s3:ListBucket]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::experimento-lean-sitio-*
                  - !Sub arn:${AWS::Partition}:s3:::bugdojo-mvp-sitio-*
              - Sid: SincronizarArchivosDeLosSitios
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::experimento-lean-sitio-*/*
                  - !Sub arn:${AWS::Partition}:s3:::bugdojo-mvp-sitio-*/*
              - Sid: InvalidarCache
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*

Outputs:
  RolGitHubArn:
    Description: Variable AWS_ROLE_ARN del repo
    Value: !GetAtt RolGitHub.Arn
  RolCloudFormationArn:
    Description: Variable CFN_ROLE_ARN del repo
    Value: !GetAtt RolCloudFormation.Arn
  BucketArtefactos:
    Description: Variable SAM_S3_BUCKET del repo
    Value: !Ref Artefactos
